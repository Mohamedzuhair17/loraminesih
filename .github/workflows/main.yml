name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project if needed
        run: |
          if [ ! -d android ]; then
            zipfile=$(ls *.zip | head -n 1)
            echo "Extracting $zipfile"
            unzip -q "$zipfile"
            if [ -d loramine/android ]; then
              mv loramine/android android
              mv loramine/package.json package.json
            elif [ -d loramine_android_project/android ]; then
              mv loramine_android_project/android android
              mv loramine_android_project/package.json package.json
            fi
          fi
          test -f android/gradlew && echo "gradlew found" || (echo "gradlew still missing" && exit 1)

      - name: Install npm dependencies
        run: npm install

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loramine-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
